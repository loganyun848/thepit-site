<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문의하기 · THE PIT</title>
  <meta name="description" content="THE PIT 서비스, 협업, 제휴에 대해 문의해 주세요. 이메일 주소와 내용을 입력하면 담당자에게 바로 전달됩니다." />
  <link rel="canonical" href="https://the-pit.site/contact.html" />
  <link rel="icon" href="assets/golky.webp" type="image/webp" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contact.css?v=20261026" />
</head>
<body>
  <header class="nav"><a href="index.html" class="nav__brand" aria-label="THE PIT 홈"><img src="assets/golky.webp" alt="" class="nav__golky" /><span class="nav__word">THE <em>PIT</em></span></a><nav class="contact-nav" aria-label="주 메뉴"><a href="fit.html">Fit Room</a><a href="index.html">홈으로 ↗</a></nav></header>
  <main class="contact-page container">
    <div class="contact-heading"><p class="eyebrow">THE PIT / CONTACT</p><h1>어떤 이야기를<br /><span class="gold">들려주실 건가요?</span></h1><p>서비스 이용, 협업, 제휴 등 궁금한 점을 남겨 주세요.<br />입력하신 이메일 주소로 답변드리겠습니다.</p></div>
    <section class="contact-panel" aria-label="문의 접수">
      <form id="contactForm">
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="row"><label class="field"><span class="field__label">이름 또는 회사명 <small>선택</small></span><input name="name" type="text" maxlength="80" autocomplete="name" placeholder="어떻게 불러드릴까요?" /></label><label class="field"><span class="field__label">이메일 주소 <i>*</i></span><input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="답변받을 이메일 주소" /></label></div>
        <label class="field"><span class="field__label">문의 유형</span><select name="topic"><option>서비스 문의</option><option>브랜드 협업 · 제휴</option><option>콘텐츠 · 제작 문의</option><option>개인정보 관련 요청</option><option>기타 문의</option></select></label>
        <label class="field"><span class="field__label">문의 내용 <i>*</i></span><textarea name="message" rows="6" required minlength="10" maxlength="3000" placeholder="문의 내용을 10자 이상 입력해 주세요."></textarea><small>최대 3,000자</small></label>
        <label class="check"><input type="checkbox" name="agreePrivacy" required /><span>문의 접수와 답변을 위한 이메일·문의 내용 수집 및 <a href="privacy.html" target="_blank" rel="noopener">개인정보 처리 안내</a>에 동의합니다. <i>*</i></span></label>
        <p class="contact-note" id="contactNote" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn--gold btn--block" id="contactSubmit">문의 접수 보내기 ↗</button>
        <p class="contact-fine">수신: ceo@lecple.com · 사이트에서 바로 전송됩니다.<br />문의 전달에는 FormSubmit 서비스를 사용합니다.</p>
      </form>
      <div id="contactDone" class="contact-done" hidden tabindex="-1"><span aria-hidden="true">✓</span><h2>문의가 접수되었습니다.</h2><p>입력하신 이메일로 답변드리겠습니다.</p><a class="btn btn--gold" href="index.html">홈으로 돌아가기</a><button type="button" id="contactAgain">다른 문의 작성하기</button></div>
    </section>
  </main>
  <footer class="contact-footer">© 2026 LECPLE Inc. · <a href="privacy.html">개인정보 처리 안내</a></footer>
  <noscript><p class="container">문의 전송을 위해 JavaScript를 켜 주세요.</p></noscript>
  <script src="config.js?v=20261026"></script><script src="form-delivery.js?v=20261026"></script><script src="contact.js?v=20261026"></script>
</body>
</html>
