name: Fit Room checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/tryon/package-lock.json
      - run: npm ci --prefix backend/tryon
      - run: node --test tests/fit-sizing.test.cjs tests/form-delivery.test.cjs tests/tryon-worker.test.mjs tests/ai-setup.test.cjs backend/tryon/tests/studio.test.mjs backend/tryon/tests/gate-runtime.test.cjs tests/avatar-model.test.mjs tests/avatar-blend.test.mjs backend/tryon/tests/avatar-studio.test.mjs backend/tryon/tests/application-handoff.test.mjs tests/production.test.mjs backend/tryon/tests/production-ui.test.mjs backend/tryon/tests/production-runtime.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s backend/production/tests -v
      - run: npm run check --prefix backend/tryon
