name: Fit Room checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/tryon/package-lock.json
      - run: npm ci --prefix backend/tryon
      - run: node --test tests/fit-sizing.test.cjs tests/form-delivery.test.cjs tests/tryon-worker.test.mjs tests/ai-setup.test.cjs backend/tryon/tests/studio.test.mjs
      - run: npm run check --prefix backend/tryon
